# =============================================================================
# palette.toml — the ONE place color values live.
#
# This is the single source of truth for the whole desktop's color theme:
# "macglass" — macOS system colors on neutral graphite backgrounds, green
# accent. Values here match colors/macglass.lua (nvim), kitty.conf, and
# tmux/theme.conf exactly, so the whole desktop reads as one surface.
#
# Edit values here, then run `generate.py` to re-render every app's colors:
#   python3 config/theme/colors/generate.py
#
# generate.py does two things:
#   1. Writes import-ready fragments into this directory (colors.css,
#      colors.rasi, hypr-colors.conf, kitty-colors.conf, alacritty-colors.toml)
#      for apps whose config format supports importing another file.
#   2. Directly rewrites the color values baked into apps whose config format
#      has no import mechanism (mako, kdeglobals, qt6ct, Kvantum, fzf, etc.),
#      so every app still ultimately derives from this file even where it
#      can't literally @import it.
#
# nvim, tmux, and kitty are hand-authored (colors/macglass.lua, theme.conf,
# kitty.conf) and NOT touched by generate.py — their comments say to edit
# lua/star/palette.lua by hand and keep it in sync with this file.
# =============================================================================

[meta]
name        = "macglass"
description = "macOS system colors on neutral graphite backgrounds, green accent"

[color]
# ── Backgrounds (graphite, macOS dark-mode window chrome) ───────────────────
base       = "#1A1A1C"  # window background
mantle     = "#161618"  # deeper background (inactive windows, sidebars)
crust      = "#131315"  # deepest background (shadows, root layers)
surface0   = "#232326"  # elevated surfaces: popups, floats, statusline
surface1   = "#28282B"  # cursorline / selection-adjacent background
surface2   = "#3A3A3D"  # borders, separators
overlay0   = "#6E6E73"  # placeholder / muted text (tertiaryLabel, comments)

# ── Text (macOS label colors) ────────────────────────────────────────────────
text       = "#E5E5E7"  # primary text / label
subtext0   = "#A1A1A6"  # secondary text (secondaryLabel)
subtext1   = "#48484A"  # quaternary text (disabled, quaternaryLabel)

# ── System colors (Apple HIG dark-mode system palette) ──────────────────────
lavender   = "#5E5CE6"  # systemIndigo — links-visited, secondary accent
blue       = "#0A84FF"  # systemBlue   — info, links
sapphire   = "#64D2FF"  # systemCyan   — sky / info variant
teal       = "#40C8E0"  # systemTeal
green      = "#32D74B"  # systemGreen  — success (dark-mode value)
mint       = "#66D4A0"  # softened green — strings, secondary success
yellow     = "#FFD60A"  # systemYellow — warning
peach      = "#FF9F0A"  # systemOrange — orange accent
red        = "#FF453A"  # systemRed    — error / destructive
pink       = "#FF7AB2"  # systemPink (softened)
rosewater  = "#FFD7B5"  # warm highlight (cursor color, indexed accents)
purple     = "#BF5AF2"  # systemPurple — reserved: Tor-connected indicator

# ── Accent (user-selected: macOS System Green) ───────────────────────────────
accent     = "#30D158"  # active borders, focus rings, selection, highlight
accent_dim = "#30D15888"  # accent at ~53% alpha, for dim/inactive states
