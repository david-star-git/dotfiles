# =============================================================================
# ~/.config/tmux/theme.conf — "macglass" status bar theme
#
# Hand-rolled with tmux's native status-*/pane-*/mode-* styling options,
# replacing the omerxx/catppuccin-tmux plugin. Same palette as the nvim
# colorscheme (colors/macglass.lua) and kitty (kitty.conf): graphite
# backgrounds, System Green as the one accent.
#
# Deliberately flat rather than powerline-style (no arrow/chevron separators)
# — solid color blocks for "this is active/current", plain text otherwise.
# Reads closer to macOS's own minimal menu bar than a Linux-ricer powerline
# bar, and sidesteps depending on Nerd Font glyphs rendering correctly.
#
# Palette reference (keep in sync with lua/star/palette.lua):
#   bg           #1a1a1c
#   bg_elevated  #232326
#   fg           #e5e5e7
#   fg_dim       #a1a1a6
#   border       #3a3a3d
#   green        #30d158  (accent)
# =============================================================================

# ── Status bar base ────────────────────────────────────────────────────────────
# "default" background so the bar blends into kitty's transparent/blurred
# background rather than drawing a solid opaque strip across the top.
set -g status-style "bg=default,fg=#a1a1a6"
set -g status-interval 5

# ── Left: session name ─────────────────────────────────────────────────────────
# A solid green block — same visual language used for "the current window"
# below, so green consistently means "you are here."
set -g status-left-length 32
set -g status-left "#[fg=#1a1a1c,bg=#30d158,bold] #S #[fg=#a1a1a6,bg=default] "

# ── Right: off by default ─────────────────────────────────────────────────────
# Matches the previous setup's preference (right side disabled). Uncomment to
# show the current directory and clock, styled the same way as the session
# block on the left (green pill for the "live" clock, plain text otherwise).
set -g status-right-length 60
set -g status-right ""
# set -g status-right "#[fg=#a1a1a6,bg=default]#{pane_current_path} #[fg=#1a1a1c,bg=#30d158,bold] %d.%m.%Y %H:%M "

# ── Windows ───────────────────────────────────────────────────────────────────
set -g window-status-separator " "

# Inactive windows: plain number + name on the transparent background.
set -g window-status-format " #I:#W "
set -g window-status-style "fg=#a1a1a6,bg=default"

# Current window: same green filled block as the session name, plus a zoom
# indicator when the pane is zoomed.
set -g window-status-current-format "#[fg=#1a1a1c,bg=#30d158,bold] #I:#W#{?window_zoomed_flag,(),} #[fg=#a1a1a6,bg=default]"
set -g window-status-current-style "fg=#1a1a1c,bg=#30d158,bold"

set -g window-status-activity-style "fg=#ffd60a,bg=default"
set -g window-status-bell-style "fg=#ff453a,bg=default,bold"

# ── Panes ─────────────────────────────────────────────────────────────────────
# The active pane gets a green border — a focus ring, basically, echoing how
# the nvim colorscheme uses the same green for a focused floating window's
# border (see FloatBorder / border_accent in colors/macglass.lua).
set -g pane-border-style "fg=#3a3a3d"
set -g pane-active-border-style "fg=#30d158"

# ── Popups (display-popup: lazygit, quick terminal, ranger — see remap.conf) ──
set -g popup-border-style "fg=#30d158"

# ── Command prompt / messages ─────────────────────────────────────────────────
set -g message-style "fg=#30d158,bg=#232326,bold"
set -g message-command-style "fg=#e5e5e7,bg=#232326"

# ── Copy mode selection ────────────────────────────────────────────────────────
set -g mode-style "fg=#1a1a1c,bg=#30d158"

# ── prefix+q pane number overlay ──────────────────────────────────────────────
set -g display-panes-colour "#a1a1a6"
set -g display-panes-active-colour "#30d158"

# ── clock-mode (prefix+t) ──────────────────────────────────────────────────────
set -g clock-mode-colour "#30d158"
