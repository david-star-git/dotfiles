# =============================================================================
# theme.conf — visual identity
#
# Palette: Apple Dark Mode (macOS system colors), green accent (#30D158).
# Single source of truth: config/theme/colors/palette.toml — edit values
# there and run `python3 config/theme/colors/generate.py` to re-render.
# All $col_* variables (below, via source=) are available in hyprland.conf
# and windowrules.conf.
# =============================================================================

source = ~/.config/theme/colors/hypr-colors.conf
$col_crimson = $col_accent   # back-compat alias — windowrules.conf etc. may still reference $col_crimson

# ── Cursor, GTK, QT6 ──────────────────────────────────────────────────────────
env = WLR_NO_HARDWARE_CURSORS,1
env = XCURSOR_SIZE,24

env = GTK_THEME,WhiteSur-Dark-green
env = XCURSOR_THEME,WhiteSur-cursors

env = QT_QPA_PLATFORMTHEME,qt6ct
env = KDE_SESSION_VERSION,5
env = KDE_FULL_SESSION,true

env = TERMINAL,kitty

# env = HYPRCURSOR_SIZE,24

# ── Decoration ────────────────────────────────────────────────────────────────
decoration {
    # Rounded corners on every window
    rounding = 4

    # Active/inactive opacity — slight transparency on inactive windows
    active_opacity   = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    # Drop shadows
    shadow {
        enabled      = true
        range        = 20
        render_power = 3
        color        = rgba(11111Bee)   # crust with alpha
        offset       = 0 4
    }

    # Background blur (works on kitty, rofi, etc. with blur = true)
    blur {
        enabled       = true
        size          = 6
        passes        = 3
        noise         = 0.02
        contrast      = 0.9
        brightness    = 0.8
        vibrancy      = 0.2
        new_optimizations = true
        xray          = false
    }
}

# ── Animations ────────────────────────────────────────────────────────────────
# Bezier curves are named and reused in animation = lines below.
animations {
    enabled = true

    # ── Curves ──────────────────────────────────────────────────────────────
    # easeOutQuint — fast start, smooth deceleration (windows opening/closing)
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    # easeInOutCubic — symmetric ease (workspace switches)
    bezier = easeInOutCubic, 0.65, 0.05, 0.35, 0.95
    # easeOutBack — slight overshoot on open (lively feel)
    bezier = easeOutBack, 0.34, 1.56, 0.64, 1
    # linear — constant speed (border / fade tweaks)
    bezier = linear, 0, 0, 1, 1

    # ── Window animations ───────────────────────────────────────────────────
    animation = windowsIn,   1, 5,  easeOutBack,    popin 80%
    animation = windowsOut,  1, 4,  easeOutQuint,   popin 80%
    animation = windowsMove, 1, 4,  easeOutQuint

    # ── Workspace transitions ───────────────────────────────────────────────
    animation = workspaces,  1, 5,  easeInOutCubic, slidevert

    # ── Fade ────────────────────────────────────────────────────────────────
    animation = fadeIn,      1, 4,  easeOutQuint
    animation = fadeOut,     1, 3,  easeOutQuint
    animation = fadeLayers,  1, 4,  linear          # rofi, mako, etc.

    # ── Border color lerp ───────────────────────────────────────────────────
    animation = border,      1, 8,  linear
    animation = borderangle, 1, 8,  linear,         loop  # enables gradient rotation if used
}

# ── Dwindle layout ────────────────────────────────────────────────────────────
# Matches i3's default tiling behaviour.
dwindle {
    preserve_split     = true    # split direction remembered per-node
    smart_split        = false
    force_split        = 2       # always split to the right / bottom
}

# ── Master layout (optional, not default) ─────────────────────────────────────
master {
    new_status  = slave
    mfact       = 0.55
}
