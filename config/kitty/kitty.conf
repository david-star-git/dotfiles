# =============================================================================
# ~/.config/kitty/kitty.conf
#
# "macglass" theme — matches colors/macglass.lua in the nvim config and
# theme.conf in the tmux config, so all three read as one consistent surface.
# Custom macOS-inspired graphite palette with System Green as the accent.
#
# Live reload: Ctrl+Shift+F5
# Inline images: kitty +kitten icat <file>
# =============================================================================

# ── Shell ─────────────────────────────────────────────────────────────────────
# Attach to an existing tmux session called "main" on launch, or create it if
# it doesn't exist yet. -A means attach-or-create.
shell /usr/bin/tmux new-session -A -s main

# ── Terminal identity ─────────────────────────────────────────────────────────
# xterm-kitty enables kitty-specific features: full keyboard protocol, graphics
# protocol (inline images), undercurl, etc. Only change to xterm-256color if
# a specific program misbehaves.
term xterm-kitty
linux_display_server x11
confirm_os_window_close 0

# ── Window / "liquid glass" ───────────────────────────────────────────────────
# Padding in pixels around the terminal content on each side. Bumped up from 3
# for a more spacious, airy feel (closer to Terminal.app/iTerm's default
# breathing room than a cramped Linux terminal default).
window_padding_width 8

# Background transparency. 1.0 = fully opaque, 0.0 = fully transparent.
# Note this only affects cells using the *default* background color — text on
# an explicitly-colored background (status bars, selections, popup menus)
# stays fully opaque and legible regardless of this setting.
# Requires a compositor to actually render the transparency (KWin on Plasma
# handles this automatically — no extra setup needed).
# Bumped from 0.4 → 0.82: 0.4 was very see-through for actively reading code
# (most editor text sits on the default background), 0.82 keeps a clear glass
# effect while staying comfortable to read for long stretches. Tune to taste.
background_opacity 0.82

# Blur radius applied to whatever is behind the window. Higher = more blurred.
# Requires compositor support (KWin: on by default for translucent windows).
# The previous value (1) was barely perceptible — this is a real blur radius.
background_blur 40

# Smoothly animates the cursor between positions instead of jumping — the
# "gliding" cursor macOS apps have. Needs kitty >= 0.36; if your version is
# older, kitty will just ignore this line.
cursor_trail 3

# Keep the title bar static — dynamic titles change based on the running
# program (e.g. nvim shows the filename). Set to "yes" to re-enable.
dynamic_title no
title kitty

# ── Font ──────────────────────────────────────────────────────────────────────
# MonoLisa. Check available names with: kitty +list-fonts | grep -i monolisa
font_family      MonoLisa Regular
bold_font        MonoLisa Bold
italic_font      MonoLisa Regular Italic
bold_italic_font MonoLisa Bold Italic
font_size        11.0

# ── Mouse ─────────────────────────────────────────────────────────────────────
# Right-click pastes from clipboard.
mouse_map right press ungrabbed paste_from_clipboard

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Bell ──────────────────────────────────────────────────────────────────────
enable_audio_bell no

# =============================================================================
# Colors — "macglass"
# Custom macOS-inspired graphite palette + Apple system accent colors.
# System Green is the accent (selection, cursor, color2/10).
# Keep in sync with lua/star/palette.lua and tmux's theme.conf.
# =============================================================================

# Base text and background
foreground #e5e5e7
background #1a1a1c

# Text shown when the terminal is dimmed (e.g. inactive window)
dim_foreground #6e6e73

# Text and background of selected text regions — using the accent green here
# mirrors how macOS itself tints text selection with your chosen system
# accent color.
selection_foreground #1a1a1c
selection_background #30d158

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor            #32d74b
cursor_text_color #1a1a1c
cursor_shape beam

# ── URL underline ─────────────────────────────────────────────────────────────
url_color #0a84ff

# ── Mark highlights (Ctrl+Shift+H in kitty) ───────────────────────────────────
mark1_foreground #1a1a1c
mark1_background #a1a1a6
mark2_foreground #1a1a1c
mark2_background #30d158

# ── Normal 16 colors ─────────────────────────────────────────────────────────
# These map to the standard terminal color slots (color0–color15).
# Programs that use "bold red" or "bright green" etc. pull from these.

# Normal
color0  #3a3a3d   # black   (border/graphite)
color1  #ff453a   # red
color2  #30d158   # green   — the accent
color3  #ffd60a   # yellow
color4  #0a84ff   # blue
color5  #ff7ab2   # magenta (pink)
color6  #40c8e0   # cyan    (teal)
color7  #a1a1a6   # white   (secondary label)

# Bright
color8  #6e6e73   # bright black  (tertiary label)
color9  #ff453a   # bright red    (same — intentional)
color10 #32d74b   # bright green  (slightly brighter accent)
color11 #ffd60a   # bright yellow (same)
color12 #0a84ff   # bright blue   (same)
color13 #ff7ab2   # bright magenta (same)
color14 #64d2ff   # bright cyan   (brighter than normal teal — extra variety)
color15 #e5e5e7   # bright white  (primary label)

# ── Extended indexed colors ───────────────────────────────────────────────────
# Extra accent slots some prompts/syntax highlighters reach for.
color16 #ff9f0a   # orange
color17 #66d4a0   # mint (matches nvim's string color)
